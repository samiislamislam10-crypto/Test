{% extends "base.html" %}{% block body %}<section class="card"><div class="section-head"><h2>📁 {{name}}</h2><a href="/dashboard">Dashboard</a></div>{% if entries %}{% for item,isdir in entries %}<div class="file"><span>{{'📁' if isdir else '📄'}} {{item}}</span>{% if isdir %}<a href="/folder/{{name}}/{{item}}">Open</a>{% endif %}</div>{% endfor %}{% else %}<p class="muted">This folder is empty.</p>{% endif %}</section>{% endblock %}

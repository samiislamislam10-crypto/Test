{% extends "base.html" %}{% block body %}
<section class="card">
  <div class="section-head"><h2>main.py Login Settings</h2><a href="/dashboard">Back</a></div>
  <p class="hint">এখানে শুধু main.py-এর Uid এবং Pw পরিবর্তন হবে। অন্য কোনো কোড এডিট হবে না।</p>
  <form method="post" class="stack">
    <label>UID</label>
    <input name="uid" value="{{ current_uid }}" maxlength="64" required autocomplete="off">
    <label>New Password / Hash</label>
    <input name="pw" type="password" maxlength="512" required autocomplete="new-password" placeholder="নতুন Password/Hash লিখুন">
    <p class="hint">বর্তমান Password/Hash নিরাপত্তার জন্য দেখানো হচ্ছে না। নতুনটি লিখলে সেটি replace হবে।</p>
    <button type="submit">Save UID &amp; Password</button>
  </form>
</section>
{% endblock %}
